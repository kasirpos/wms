<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS System</title><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body>
<div id="loginPage" class="login-page"><div class="login-card"><div class="brand-mark">WMS</div><div class="brand-sub">WAREHOUSE MANAGEMENT SYSTEM</div><h1>System Login</h1><p>Warehouse & inventory control</p><form id="loginForm"><label>Username</label><input id="username" required><label>Password</label><input id="password" type="password" required><button>Sign In</button><div id="loginMessage" class="message"></div></form></div></div>
<div id="appPage" class="app hidden"><aside class="sidebar"><div class="sidebar-head"><div class="logo">W</div><div><b>WMS SYSTEM</b><small>Warehouse Control</small></div></div><nav id="nav"></nav><button id="logoutBtn" class="logout">↪ Logout</button></aside>
<main class="main"><header class="topbar"><div class="title-wrap"><button id="mobileMenu" class="mobile">☰</button><div><h2 id="pageTitle">Dashboard</h2><span id="pageSub">Inventory Control & Warehouse Overview</span></div></div><div class="top-right"><span id="apiState" class="api-state">● Checking</span><button id="refreshBtn" class="refresh">↻</button><b id="userInfo">-</b></div></header><section id="content" class="content"></section></main></div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script>
<script>
const NAV=[['MAIN',[['dashboard','⌂','Dashboard']]],['MASTER DATA',[['master-part','▦','Master Part'],['warehouse','▣','Warehouse'],['customer','◉','Customer'],['bom','⌬','BOM']]],['INBOUND & WAREHOUSE',[['receiving','↓','Receiving'],['stock','▤','Stock'],['transfer','⇄','Transfer'],['issue','→','Issue Material']]],['PRODUCTION & QUALITY',[['production','⚙','Production'],['testing','✓','Testing / QC'],['material-ng','!','Material NG'],['hold','⏸','Product Hold']]],['SHIPPING',[['delivery','□','FG Delivery']]],['CONTROL & REPORT',[['stock-opname','⊙','Stock Opname'],['transactions','≡','Transactions']]]];
const META={dashboard:['Dashboard','Inventory Control & Warehouse Overview'], 'master-part':['Master Part','MasterPart'],warehouse:['Warehouse','Warehouse & Location'],customer:['Customer','Customer Master'],bom:['BOM','Bill of Material'],receiving:['Receiving','Supplier → STG'],stock:['Stock','InventoryBalance'],transfer:['Transfer','Warehouse Movement'],issue:['Issue Material','Warehouse → PROD'],production:['Production','Sub Assembly & Finish Product'],testing:['Testing / QC','PASS → FG | NG → HOLD'],'material-ng':['Material NG','PROD → MAT-NG'],hold:['Product Hold','TEST → HOLD'],delivery:['FG Delivery','FG → Customer'],'stock-opname':['Stock Opname','Physical Stock Validation'],transactions:['Transactions','Traceability']};
let CACHE={parts:[],warehouses:[],customers:[],stock:[]};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));} function fmt(x){return Number(x||0).toLocaleString('id-ID');}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(ok?'ok':'err')+' show';setTimeout(()=>t.className='toast',3000)}
function user(){try{return JSON.parse(sessionStorage.getItem('wmsUser')||'{}')}catch{return {}}}
function buildNav(){document.getElementById('nav').innerHTML=NAV.map(([sec,items])=>`<div class="nav-sec">${sec}</div>${items.map(x=>`<button class="nav-item" data-page="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('')}`).join('');document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>go(b.dataset.page));}
async function loadCache(){const jobs=[['parts','parts'],['warehouses','warehouses'],['customers','customers'],['stock','stock']];const results=await Promise.all(jobs.map(async([k,a])=>{try{return [k,await apiGet(a)]}catch(e){return [k,{success:false,error:e}]}}));results.forEach(([k,r])=>{if(r.success)CACHE[k]=r.data||[]});}
function go(page){const m=META[page]||META.dashboard;document.getElementById('pageTitle').textContent=m[0];document.getElementById('pageSub').textContent=m[1];document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('nav').classList.remove('open');if(page==='dashboard')dashboard();else if(page==='scan')scanPage();else if(page==='stock')stockPage();else if(page==='transactions')txPage();else if(page==='receiving')receivingPage();else if(page==='transfer')transferPage();else if(page==='issue')issuePage();else if(page==='production')productionPage();else if(page==='testing')testingPage();else if(page==='material-ng')materialNGPage();else if(page==='hold')holdPage();else if(page==='delivery')deliveryPage();else if(page==='stock-opname')opnamePage();else if(page==='master-part')masterPartPage();else if(page==='warehouse')warehousePage();else if(page==='customer')customerPage();else if(page==='bom')bomPage();}
function shell(title,desc,body,action=''){document.getElementById('content').innerHTML=`<div class="page-head"><div><h3>${title}</h3><p>${desc}</p></div>${action}</div>${body}`}
function sel(name,items,placeholder='Select...'){return `<select id="${name}"><option value="">${placeholder}</option>${items.map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('')}</select>`}
function parts(){return CACHE.parts.map(x=>({id:x.PartID,label:`${x.PartNumber} — ${x.PartName||''}`}));}function whs(){return CACHE.warehouses.map(x=>({id:x.WarehouseID,label:`${x.WarehouseCode} — ${x.WarehouseName}`}));}function custs(){return CACHE.customers.map(x=>({id:x.CustomerID,label:`${x.CustomerCode} — ${x.CustomerName}`}));}
function formCard(fields,submitText='Save'){return `<div class="form-card"><div class="form-grid">${fields.join('')}</div><div class="form-actions"><button class="btn ghost" onclick="go(document.querySelector('.nav-item.active')?.dataset.page||'dashboard')">Cancel</button><button class="btn primary" id="saveBtn">${submitText}</button></div></div>`}
function f(label,id,type='text',extra=''){return `<label class="field"><span>${label}</span><input id="${id}" type="${type}" ${extra}></label>`}function fs(label,id,html){return `<label class="field"><span>${label}</span>${html}</label>`}
async function dashboard(){shell('Dashboard','Inventory Control & Warehouse Overview',`<div class="dash-tools"><div><small>LIVE WMS MONITORING</small><h3>Inventory Control</h3></div><div class="filter-chip">All Warehouse · Today</div></div><div class="kpis">${['Total Stock','Stock Lines','Total Transactions',"Today's Transactions",'Active Parts'].map((x,i)=>`<div class="kpi k${i}"><span>${x}</span><b id="k${i}">-</b><small>Live from WMS</small></div>`).join('')}</div><div class="grid3"><div class="panel span2"><h4>Stock by Warehouse</h4><div id="whChart"></div></div><div class="panel"><h4>Top 5 Stock</h4><div id="topStock"></div></div><div class="panel"><h4>Stock by Category</h4><div id="catChart"></div></div><div class="panel span2"><h4>Recent Transactions</h4><div id="recent"></div></div><div class="panel"><h4>System Status</h4><div class="system-ok">● API Connected</div><small id="statusDetail">Loading...</small></div></div>`);try{const [d,t]=await Promise.all([apiGet('dashboard'),apiGet('transactions',{limit:8})]);if(!d.success)throw Error(d.message);const x=d.data;['totalStock','balanceLines','totalTransactions','todayTransactions'].forEach((k,i)=>document.getElementById('k'+i).textContent=fmt(x[k]));document.getElementById('k4').textContent=fmt(CACHE.parts.length);const wm={};CACHE.warehouses.forEach(w=>wm[w.WarehouseID]=w);const sums={};CACHE.stock.forEach(s=>sums[s.WarehouseID]=(sums[s.WarehouseID]||0)+Number(s.QtyOnHand||0));const max=Math.max(1,...Object.values(sums));document.getElementById('whChart').innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([id,q])=>`<div class="bar"><span>${esc(wm[id]?.WarehouseCode||id)}</span><div><i style="width:${q/max*100}%"></i></div><b>${fmt(q)}</b></div>`).join('')||'<div class="empty">No data</div>';const pm={};CACHE.parts.forEach(p=>pm[p.PartID]=p);const ps={};CACHE.stock.forEach(s=>ps[s.PartID]=(ps[s.PartID]||0)+Number(s.QtyOnHand||0));document.getElementById('topStock').innerHTML=Object.entries(ps).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,q],i)=>`<div class="rank"><em>${i+1}</em><span><b>${esc(pm[id]?.PartNumber||id)}</b><small>${esc(pm[id]?.PartName||'')}</small></span><strong>${fmt(q)}</strong></div>`).join('')||'<div class="empty">No data</div>';const cats={};Object.entries(ps).forEach(([id,q])=>{const c=pm[id]?.Category||'Other';cats[c]=(cats[c]||0)+q});const ct=Object.values(cats).reduce((a,b)=>a+b,0)||1;document.getElementById('catChart').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,q])=>`<div class="cat"><span>${esc(c)}</span><b>${Math.round(q/ct*100)}%</b><div><i style="width:${q/ct*100}%"></i></div></div>`).join('')||'<div class="empty">No data</div>';document.getElementById('recent').innerHTML=(t.data||[]).map(z=>`<div class="tx"><span><b>${esc(z.TransactionType)}</b><small>${esc(pm[z.PartID]?.PartNumber||z.PartID||'-')} · ${esc(z.BatchNo||'-')}</small></span><strong>${fmt(z.Qty)}</strong><small>${esc(z.CreatedBy||'-')}</small></div>`).join('')||'<div class="empty">No data</div>';document.getElementById('statusDetail').textContent=`${CACHE.stock.length} balance lines · ${t.data?.length||0} recent transactions loaded`;document.getElementById('apiState').textContent='● API Connected';document.getElementById('apiState').className='api-state good'}catch(e){document.getElementById('statusDetail').textContent=e.message;document.getElementById('apiState').textContent='● API Error';document.getElementById('apiState').className='api-state bad'}}
function stockPage(){
  const pm=Object.fromEntries(CACHE.parts.map(x=>[x.PartID,x]));
  const wm=Object.fromEntries(CACHE.warehouses.map(x=>[x.WarehouseID,x]));
  shell('Stock','Current inventory by part, batch and location',`
    <div class="table-card">
      <div class="warehouse-filter">
        <div class="warehouse-filter-title">Warehouse</div>
        <div id="warehouseTabs" class="warehouse-tabs"></div>
        <div id="stockSelected" class="stock-selected">Warehouse: ALL</div>
      </div>
      <div class="table-tools">
        <input id="stockSearch" placeholder="Search part / batch..." oninput="filterStock()">
        <button class="btn ghost" onclick="refreshStockPage()">↻ Refresh</button>
      </div>
      <div id="stockRows"></div>
    </div>`);

  window._stockWarehouse='ALL';
  window._stockRows=CACHE.stock.map(x=>({
    part:pm[x.PartID]?.PartNumber||x.PartID,
    partName:pm[x.PartID]?.PartName||'',
    warehouse:wm[x.WarehouseID]?.WarehouseCode||x.WarehouseID,
    warehouseId:x.WarehouseID,
    batch:x.BatchNo||'',
    qty:x.QtyOnHand,
    available:x.QtyAvailable
  }));

  renderWarehouseTabs();
  renderFilteredStock();
}

function renderWarehouseTabs(){
  const el=document.getElementById('warehouseTabs');
  if(!el)return;
  const warehouses=CACHE.warehouses.filter(w=>String(w.Status||'ACTIVE').toUpperCase()!=='INACTIVE');
  el.innerHTML=[`<button class="wh-tab ${window._stockWarehouse==='ALL'?'active':''}" onclick="selectStockWarehouse('ALL')">ALL</button>`,
    ...warehouses.map(w=>`<button class="wh-tab ${window._stockWarehouse===w.WarehouseID?'active':''}" onclick="selectStockWarehouse('${esc(w.WarehouseID)}')">${esc(w.WarehouseCode)}</button>`)
  ].join('');
}

function selectStockWarehouse(warehouseId){
  window._stockWarehouse=warehouseId;
  const wm=Object.fromEntries(CACHE.warehouses.map(x=>[x.WarehouseID,x]));
  const label=warehouseId==='ALL'?'ALL':(wm[warehouseId]?.WarehouseCode||warehouseId);
  const selected=document.getElementById('stockSelected');
  if(selected)selected.textContent='Warehouse: '+label;
  renderWarehouseTabs();
  renderFilteredStock();
}

function filterStock(){renderFilteredStock()}

function renderFilteredStock(){
  const q=(document.getElementById('stockSearch')?.value||'').toLowerCase().trim();
  let rows=window._stockRows||[];
  if(window._stockWarehouse!=='ALL')rows=rows.filter(r=>r.warehouseId===window._stockWarehouse);
  if(q)rows=rows.filter(r=>`${r.part} ${r.partName} ${r.warehouse} ${r.batch}`.toLowerCase().includes(q));
  renderStockRows(rows.map(r=>[r.part,r.partName,r.warehouse,r.batch,r.qty,r.available]));
}

function renderStockRows(rows){
  document.getElementById('stockRows').innerHTML=table(['Part','Part Name','Warehouse','Batch','Qty','Available'],rows);
}

async function refreshStockPage(){
  try{
    const r=await apiGet('stock');
    if(r.success)CACHE.stock=r.data||[];
    stockPage();
    toast('Stock berhasil diperbarui.');
  }catch(e){toast(e.message||'Gagal refresh stock.',false)}
}

async function txPage(){shell('Transactions','Complete WMS transaction history',`<div class="table-card"><div id="txRows" class="loading">Loading...</div></div>`);try{const r=await apiGet('transactions',{limit:300});const pm=Object.fromEntries(CACHE.parts.map(x=>[x.PartID,x]));document.getElementById('txRows').innerHTML=table(['No','Type','Part','Qty','Batch','From','To','Status','User'],(r.data||[]).map(x=>[x.TransactionNo,x.TransactionType,pm[x.PartID]?.PartNumber||x.PartID,x.Qty,x.BatchNo||'',x.FromWarehouseID||'',x.ToWarehouseID||'',x.Status,x.CreatedBy]))}catch(e){document.getElementById('txRows').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">No data</td></tr>`}</tbody></table></div>`}
function transactionScanner(prefix, op){
  return `<div class="inline-scanner" id="scanner-${prefix}">
    <div class="inline-scanner-head"><div><b>Scan QR / Barcode</b><small>Scanner USB / Bluetooth atau kamera HP</small></div><span class="scan-op-badge">${esc((SCAN_OPS[op]||{label:op}).label)}</span></div>
    <div class="inline-scanner-row">
      <input id="${prefix}ScanRaw" class="scan-input" autocomplete="off" placeholder="Scan QR / barcode di sini..." onkeydown="if(event.key==='Enter'){event.preventDefault();handleInlineScan('${prefix}','${op}',this.value)}">
      <button class="btn ghost" type="button" onclick="handleInlineScan('${prefix}','${op}',document.getElementById('${prefix}ScanRaw').value)">PROCESS SCAN</button>
      <button class="btn ghost" type="button" onclick="startInlineCamera('${prefix}','${op}')">📷 CAMERA</button>
      <button class="btn ghost" type="button" onclick="stopInlineCamera()">STOP</button>
    </div>
    <div class="manual-inline"><input id="${prefix}ManualPart" autocomplete="off" placeholder="Manual Part Number"><button class="btn ghost" type="button" onclick="lookupInlinePart('${prefix}','${op}')">CHECK PART</button></div>
    <div id="${prefix}ScanStatus" class="inline-scan-status">Belum ada scan.</div>
    <div id="qrReader-${prefix}" class="qr-reader"></div>
  </div>`;
}

function setSelectValue(id,value){const el=document.getElementById(id);if(!el)return false;const v=String(value??'');const exists=[...el.options].some(o=>o.value===v);if(exists){el.value=v;el.dispatchEvent(new Event('change'));return true;}return false;}
function setInputValue(id,value){const el=document.getElementById(id);if(el){el.value=value??'';el.dispatchEvent(new Event('input'));return true;}return false;}
function applyScanToTransaction(prefix,op,r){
  if(!r.masterPartId){setScanStatus(prefix,'Part terbaca tetapi belum terdaftar di MasterPart.',false);return false;}
  const partTargets={receive:'partId',transfer:'partId',issue:'partId',subAssembly:'saPart',finishProduct:'fpPart',testingPass:'tpPart',testingNG:'tnPart',materialNG:'ngPart',delivery:'diPart1'};
  const qtyTargets={receive:'qty',transfer:'qty',issue:'qty',subAssembly:'saQty',finishProduct:'fpQty',testingPass:'tpQty',testingNG:'tnQty',materialNG:'ngQty',delivery:'diQty1'};
  const batchTargets={receive:'batchNo',transfer:'batchNo',issue:'batchNo',subAssembly:'saBatch',finishProduct:'fpBatch',testingPass:'tpBatch',testingNG:'tnBatch',materialNG:'ngBatch',delivery:'diBatch1'};
  const uomTargets={receive:'uom',transfer:'uom',issue:'uom'};
  const partId=partTargets[op];
  if(partId && !setSelectValue(partId,r.masterPartId)){setScanStatus(prefix,'Part ditemukan di parser tetapi belum tersedia pada daftar Part di form.',false);return false;}
  if(qtyTargets[op] && r.qty!==null) setInputValue(qtyTargets[op],r.qty);
  if(batchTargets[op] && r.batchNo) setInputValue(batchTargets[op],r.batchNo);
  if(uomTargets[op]) setInputValue(uomTargets[op],r.uom||r.masterUom||'PCS');
  if(op==='receive' && r.po) setInputValue('referenceNo',r.po);
  if(op==='stockOpname'){
    setInputValue('scanOpPhysical',r.qty??'');
    setInputValue('scanOpBatch',r.batchNo||'');
    setSelectValue('scanOpPart',r.masterPartId);
    if(v('opWh')) setTimeout(applyOpScan,0);
  }
  setScanStatus(prefix,`✓ ${r.partNumber} | Qty: ${r.qty===null?'-':fmt(r.qty)} | Batch: ${r.batchNo||'-'}`,true);
  return true;
}
function setScanStatus(prefix,msg,ok=true){const el=document.getElementById(prefix+'ScanStatus');if(el){el.textContent=msg;el.className='inline-scan-status '+(ok?'ok':'err');}}
function handleInlineScan(prefix,op,raw){if(!raw)return;try{const r=parseWmsQR(raw);window._inlineScans=window._inlineScans||{};window._inlineScans[prefix]=r;const ok=applyScanToTransaction(prefix,op,r);if(ok)toast('Scan berhasil: '+r.partNumber+(r.qty!==null?' | Qty '+r.qty:''));}catch(e){setScanStatus(prefix,e.message||'Format QR tidak valid.',false);toast(e.message||'Format QR tidak valid.',false)}}
function lookupInlinePart(prefix,op){const pn=String(document.getElementById(prefix+'ManualPart')?.value||'').trim();if(!pn){toast('Masukkan Part Number.',false);return;}const master=CACHE.parts.find(x=>String(x.PartNumber||'').trim().toUpperCase()===pn.toUpperCase());if(!master){setScanStatus(prefix,'Part Number tidak ditemukan di MasterPart: '+pn,false);toast('Part Number tidak ditemukan di MasterPart.',false);return;}const r={raw:'MANUAL:'+pn,partNumber:master.PartNumber||pn,partName:master.PartName||'',uom:master.UOM||'PCS',qty:null,batchNo:'',lot:'',po:'',date:'',dn:'',serial:'',serialNumber:'',vendor:'',plant:'',expiryDate:'',qRaw:'',fields:{},masterPartId:master.PartID,masterUom:master.UOM||'PCS',masterFound:true,manual:true};window._inlineScans=window._inlineScans||{};window._inlineScans[prefix]=r;applyScanToTransaction(prefix,op,r);toast('Part ditemukan: '+r.partNumber);}
let inlineScanner=null;
async function startInlineCamera(prefix,op){if(!window.Html5Qrcode){toast('Library kamera belum tersedia.',false);return;}await stopInlineCamera();const readerId='qrReader-'+prefix;const el=document.getElementById(readerId);if(!el)return;inlineScanner=new Html5Qrcode(readerId);try{await inlineScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:180}},txt=>{handleInlineScan(prefix,op,txt);stopInlineCamera();});setScanStatus(prefix,'Kamera aktif. Arahkan ke QR/barcode.',true);}catch(e){inlineScanner=null;toast('Kamera tidak dapat dibuka: '+e,false);}}
async function stopInlineCamera(){if(!inlineScanner)return;try{await inlineScanner.stop();await inlineScanner.clear()}catch(e){}inlineScanner=null;}

function receivingPage(){shell('Receiving','Supplier → STG · Receiving transaction',`<div class="form-card">${transactionScanner('receive','receive')}<div class="form-grid">${fs('Part Number','partId',sel('partId',parts()))}${f('Quantity','qty','number','min="0.000001" step="any"')}${f('UOM','uom','text','value="PCS"')}${f('Batch No','batchNo')}${f('Reference / PO','referenceNo')}${f('Remarks','remarks')}</div><div class="form-actions"><button class="btn ghost" onclick="go('receiving')">Cancel</button><button class="btn primary" id="saveBtn">Save Receiving</button></div></div>`);document.getElementById('saveBtn').onclick=async()=>submit('receive',{partId:v('partId'),qty:Number(v('qty')),uom:v('uom')||'PCS',batchNo:v('batchNo'),referenceNo:v('referenceNo'),remarks:v('remarks')},'Receiving')}
function transferPage(){shell('Transfer','Move stock between warehouse locations',`<div class="form-card">${transactionScanner('transfer','transfer')}<div class="form-grid">${fs('Part Number','partId',sel('partId',parts()))}${fs('From Warehouse','fromWarehouseId',sel('fromWarehouseId',whs()))}${fs('To Warehouse','toWarehouseId',sel('toWarehouseId',whs()))}${f('Quantity','qty','number','min="0.000001" step="any"')}${f('UOM','uom','text','value="PCS"')}${f('Batch No','batchNo')}${f('Reference','referenceNo')}${f('Remarks','remarks')}</div><div class="form-actions"><button class="btn ghost" onclick="go('transfer')">Cancel</button><button class="btn primary" id="saveBtn">Save Transfer</button></div></div>`);document.getElementById('saveBtn').onclick=async()=>submit('transfer',{partId:v('partId'),fromWarehouseId:v('fromWarehouseId'),toWarehouseId:v('toWarehouseId'),qty:Number(v('qty')),uom:v('uom')||'PCS',batchNo:v('batchNo'),referenceNo:v('referenceNo'),remarks:v('remarks')},'Transfer')}
function issuePage(){const source=whs().filter(x=>['WH-L2','WH-INV'].includes(x.label.split(' ')[0]));shell('Issue Material','WH-L2 / WH-INV → PROD · Issue is stock movement only',`<div class="form-card">${transactionScanner('issue','issue')}<div class="form-grid">${fs('Part Number','partId',sel('partId',parts()))}${fs('From Warehouse','fromWarehouseId',sel('fromWarehouseId',source))}${f('Quantity','qty','number','min="0.000001" step="any"')}${f('UOM','uom','text','value="PCS"')}${f('Batch No','batchNo')}${f('Reference','referenceNo')}${f('Remarks','remarks')}</div><p class="muted">Issue Material hanya memindahkan stock WH-L2 / WH-INV → PROD. Bukan consumption.</p><div class="form-actions"><button class="btn ghost" onclick="go('issue')">Cancel</button><button class="btn primary" id="saveBtn">Save Issue</button></div></div>`);document.getElementById('saveBtn').onclick=async()=>submit('issue',{partId:v('partId'),fromWarehouseId:v('fromWarehouseId'),qty:Number(v('qty')),uom:v('uom')||'PCS',batchNo:v('batchNo'),referenceNo:v('referenceNo'),remarks:v('remarks')},'Issue')}
function productionPage(){shell('Production','Sub Assembly dan Finish Product',`<div class="process-cards"><div class="process"><h4>SUB ASSEMBLY</h4><p>PROD → consume BOM → SUB output</p>${transactionScanner('sa','subAssembly')}<div class="form-grid">${fs('Parent Part','saPart',sel('saPart',parts()))}${f('Output Qty','saQty','number','min="0.000001" step="any"')}${f('Output Batch','saBatch')}${f('Reference','saRef')}</div><div class="form-actions"><button class="btn primary" id="saSave">Create Sub Assembly</button></div></div><div class="process"><h4>FINISH PRODUCT</h4><p>SUB → consume BOM → TEST output</p>${transactionScanner('fp','finishProduct')}<div class="form-grid">${fs('Parent Part','fpPart',sel('fpPart',parts()))}${f('Output Qty','fpQty','number','min="0.000001" step="any"')}${f('Output Batch','fpBatch')}${f('Reference','fpRef')}</div><div class="form-actions"><button class="btn primary" id="fpSave">Create Finish Product</button></div></div></div>`);document.getElementById('saSave').onclick=()=>submit('subAssembly',{parentPartId:v('saPart'),qty:Number(v('saQty')),uom:'PCS',outputBatchNo:v('saBatch'),referenceNo:v('saRef')},'Sub Assembly');document.getElementById('fpSave').onclick=()=>submit('finishProduct',{parentPartId:v('fpPart'),qty:Number(v('fpQty')),uom:'PCS',outputBatchNo:v('fpBatch'),referenceNo:v('fpRef')},'Finish Product')}

function parseWmsQR(raw){
  const text=String(raw||'').trim();
  if(!text) throw new Error('Data scan kosong.');
  const result={raw:text,partNumber:'',partName:'',uom:'',qty:null,batchNo:'',lot:'',po:'',date:'',dn:'',serial:'',serialNumber:'',vendor:'',plant:'',expiryDate:'',qRaw:'',fields:{}};

  // Format WMS internal: P001|100|BATCH001
  const pipe=text.split('|').map(x=>x.trim());
  if(pipe.length>=1 && pipe[0] && !text.includes(';') && !text.includes(':')){
    result.partNumber=pipe[0]||'';
    if(pipe[1]!==undefined && pipe[1]!=='') result.qty=Number(pipe[1]);
    result.batchNo=pipe[2]||'';
  }

  // Supplier / structured QR: M:P001/PCS;Q:100;B:BATCH001;...
  text.split(';').map(x=>x.trim()).filter(Boolean).forEach(token=>{
    const i=token.indexOf(':');
    if(i<0) return;
    const key=token.slice(0,i).trim();
    const val=token.slice(i+1).trim();
    result.fields[key]=val;
  });
  const m=result.fields.M||'';
  if(m){
    const slash=m.indexOf('/');
    result.partNumber=(slash>=0?m.slice(0,slash):m).trim();
    result.uom=(slash>=0?m.slice(slash+1):'').trim();
  }
  const q=result.fields.Q||'';
  result.qRaw=q;
  // WMS standard: Qty = angka pertama pada field Q.
  // Contoh: Q:24/3/47 -> Qty 24
  // Contoh: Q:48      -> Qty 48
  // Nilai Q lengkap tetap disimpan pada qRaw untuk traceability.
  if(q){
    const firstQty=String(q).trim().split('/')[0].trim();
    if(firstQty && /^[-+]?\d+(?:\.\d+)?$/.test(firstQty)){
      result.qty=Number(firstQty);
    }
  }
  result.batchNo=result.fields.B||result.batchNo||'';
  result.lot=result.fields.Lot||'';
  result.po=result.fields.PO||'';
  result.date=result.fields.D||'';
  result.dn=result.fields.DN||'';
  result.serial=result.fields.S||'';
  result.serialNumber=result.fields.SN||'';
  result.vendor=result.fields.V||'';
  result.plant=result.fields.P||'';
  result.expiryDate=result.fields.YX||'';

  if(!result.partNumber) throw new Error('Part Number tidak ditemukan pada QR/barcode.');
  const master=CACHE.parts.find(x=>String(x.PartNumber||'').trim()===result.partNumber);
  result.partName=master?.PartName||'';
  result.masterPartId=master?.PartID||'';
  result.masterUom=master?.UOM||'';
  if(!result.uom) result.uom=result.masterUom||'PCS';
  result.masterFound=!!master;
  return result;
}

async function lookupManualPart(){
  const input=document.getElementById('manualPartNumber');
  const pn=String(input?.value||'').trim();
  if(!pn){toast('Masukkan Part Number.',false);return;}
  const master=CACHE.parts.find(x=>String(x.PartNumber||'').trim().toUpperCase()===pn.toUpperCase());
  if(!master){toast('Part Number tidak ditemukan di MasterPart: '+pn,false);return;}
  const r={raw:'MANUAL:'+pn,partNumber:master.PartNumber||pn,partName:master.PartName||'',uom:master.UOM||'PCS',qty:null,batchNo:'',lot:'',po:'',date:'',dn:'',serial:'',serialNumber:'',vendor:'',plant:'',expiryDate:'',qRaw:'',fields:{},masterPartId:master.PartID,masterUom:master.UOM||'PCS',masterFound:true,manual:true};
  renderScanResult(r);
  toast('Part ditemukan: '+r.partNumber);

function handleScan(raw){
  if(!raw) return;
  try{
    const r=parseWmsQR(raw);
    renderScanResult(r);
    const input=document.getElementById('scanRaw'); if(input) input.value=raw;
    if(r.masterFound) toast(r.qty===null?'Part terbaca. Qty tidak ditemukan.':'Scan berhasil: '+r.partNumber+' | Qty: '+r.qty);
    else toast('Part terbaca tetapi belum ada di MasterPart.',false);
  }catch(e){toast(e.message||'Format QR/barcode tidak dapat dibaca.',false)}
}
async function startCamera(){
  if(!window.Html5Qrcode){toast('Library kamera belum tersedia. Gunakan scanner USB/Bluetooth.',false);return;}
  if(html5Scanner) return;
  html5Scanner=new Html5Qrcode('qrReader');
  try{
    await html5Scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:180}},txt=>{handleScan(txt);stopCamera();});
    toast('Kamera aktif. Arahkan ke QR/barcode.');
  }catch(e){html5Scanner=null;toast('Kamera tidak dapat dibuka: '+e,false)}
}
async function stopCamera(){if(!html5Scanner)return;try{await html5Scanner.stop();await html5Scanner.clear()}catch(e){}html5Scanner=null;}

function clearScan(){lastScan=null;const input=document.getElementById('scanRaw');if(input)input.value='';const rp=document.getElementById('rawPreview');if(rp)rp.textContent='-';const r=document.getElementById('scanResult');if(r)r.innerHTML='<div class="empty">Belum ada data scan.</div>';renderScanOperation();}
function selected(id){return document.getElementById(id)?.value?.trim()||'';}
let transactionBusy=false;
let lastSubmittedFingerprint='';
let lastSubmittedAt=0;
function makeRequestId(){return 'REQ-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
function transactionFingerprint(action,data){return JSON.stringify({action,partId:data.partId||data.parentPartId||'',qty:data.qty||0,uom:data.uom||'',batchNo:data.batchNo||data.outputBatchNo||'',from:data.fromWarehouseId||'',to:data.toWarehouseId||'',ref:data.referenceNo||'',username:data.username||user().Username||'admin',details:data.details||'',type:data.transactionType||''});}
async function processScannedTransaction(){
  if(transactionBusy){toast('Transaksi sedang diproses. Tunggu sampai selesai.',false);return;}
  if(!lastScan || !lastScan.masterPartId){toast('Scan atau input manual Part Number yang sudah terdaftar di MasterPart.',false);return;}
  const op=selected('scanOperationType');
  const qty=Number(selected('scanQty')||0);
  const batch=selected('scanBatch');
  const uom=selected('scanUom')||lastScan.uom||'PCS';
  const remarks=selected('scanRemarks');
  if(op!=='stockOpname' && (!qty || qty<=0)){toast('Quantity harus lebih besar dari 0.',false);return;}
  if(!batch && op!=='stockOpname'){toast('Batch No wajib diisi.',false);return;}
  const base={username:user().Username||'admin',partId:lastScan.masterPartId,qty,uom,batchNo:batch,remarks};
  let action=SCAN_OPS[op]?.action; let data={...base};
  if(op==='receive'){data.referenceNo=selected('scanRef');}
  if(op==='transfer'){data.fromWarehouseId=selected('scanFromWh');data.toWarehouseId=selected('scanToWh');}
  if(op==='issue'){data.fromWarehouseId=selected('scanFromWh');}
  if(op==='subAssembly' || op==='finishProduct'){data.parentPartId=lastScan.masterPartId;data.outputBatchNo=selected('scanOutputBatch')||batch;}
  if(op==='delivery'){data={username:user().Username||'admin',customerId:selected('scanCustomer'),vehicleNo:selected('scanVehicle'),driverName:selected('scanDriver'),remarks,details:[{partId:lastScan.masterPartId,batchNo:batch,qty,uom}]};}
  if(op==='stockOpname'){data={username:user().Username||'admin',warehouseId:selected('scanOpWh'),opnameDate:new Date().toISOString().slice(0,10),details:[{partId:lastScan.masterPartId,batchNo:batch,physicalQty:Number(selected('scanPhysical')||0),uom,remarks}]};}
  if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG'].includes(op)){

    if(op==='transfer' && (!data.fromWarehouseId||!data.toWarehouseId)){toast('From dan To Warehouse wajib dipilih.',false);return;}
    if(op==='issue' && !data.fromWarehouseId){toast('From Warehouse wajib dipilih.',false);return;}
  }
  if(op==='delivery' && (!data.customerId||!batch||qty<=0)){toast('Customer, Batch dan Qty wajib valid.',false);return;}
  if(op==='stockOpname' && !data.warehouseId){toast('Warehouse wajib dipilih.',false);return;}
  if(!action){toast('Operation tidak valid.',false);return;}
  const fp=transactionFingerprint(action,data);
  const now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  if(!confirm('Simpan transaksi '+(SCAN_OPS[op]?.label||op)+' untuk '+lastScan.partNumber+'?')) return;
  transactionBusy=true; lastSubmittedFingerprint=fp; lastSubmittedAt=now;
  const btn=document.querySelector('#scanOperation .scan-submit .primary');
  if(btn){btn.disabled=true;btn.textContent='PROCESSING...';}
  data.requestId=makeRequestId();
  try{
    const res=await apiPost(action,data);
    if(!res.success) throw new Error(res.message||'Transaksi gagal');
    toast(res.message||'Transaksi berhasil');
    clearScan();
    await refreshStockOnly();
    renderScanOperation();
  }catch(e){toast(e.message||'Transaksi gagal',false)}
  finally{
    transactionBusy=false;
    const b=document.querySelector('#scanOperation .scan-submit .primary');
    if(b){b.disabled=false;b.textContent='PROCESS TRANSACTION';}
  }
}
function scanPage(){
  shell('Scan QR / Barcode','Universal scanner: kamera HP, USB scanner, atau Bluetooth HID',`
    <div class="scan-layout">
      <div class="panel scan-panel">
        <h4>1. Scan Data</h4>

        <div id="qrReader" class="qr-reader"></div>
        <div class="scan-format"><b>Format internal:</b> P001|100|BATCH001<br><b>Format supplier:</b> M:14313141-00/PCS;Q:24/3/47;B:2605124CWW;Lot:20260512;PO:...;DN:...</div>
      </div>
      <div class="panel scan-panel">
        <h4>2. Hasil Scan</h4>
        <div id="scanResult" class="empty">Belum ada data scan.</div>
      </div>
    </div>
    <div class="panel raw-panel">
      <h4>3. Transaction dari hasil scan</h4>
      <div class="form-grid"><label class="field"><span>Operation</span><select id="scanOperationType" onchange="renderScanOperation()">${Object.entries(SCAN_OPS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></label></div>
      <div id="scanOperation"></div>
    </div>
    <div class="panel raw-panel"><h4>Raw Scan / Traceability</h4><pre id="rawPreview">-</pre></div>`);
  const input=document.getElementById('scanRaw');
  input.focus();
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleScan(input.value)}});
  renderScanOperation();
}

function bomPage(){shell('BOM','Bill of Material · Parent → Components',`<div class="form-card"><div class="form-grid">${fs('Parent Part','bomParent',sel('bomParent',parts()))}${f('BOM Version','bomVer','text','value="V1"')}${f('Effective Date','bomDate','date','value="'+new Date().toISOString().slice(0,10)+'"')}</div><h4 class="section-title">Components</h4><div id="bomItems"></div><button class="btn ghost" onclick="addBomItem()">+ Add Component</button><div class="form-actions"><button class="btn primary" id="saveBom">Save BOM</button></div></div>`);addBomItem();document.getElementById('saveBom').onclick=saveBom}
let bomCount=0;function addBomItem(){bomCount++;document.getElementById('bomItems').insertAdjacentHTML('beforeend',`<div class="line-item" id="bi${bomCount}">${fs('Component','bc'+bomCount,sel('bc'+bomCount,parts()))}${f('Qty / Unit','bq'+bomCount,'number','min="0.000001" step="any"')}${f('Scrap %','bs'+bomCount,'number','min="0" step="any" value="0"')}<button class="remove" onclick="document.getElementById('bi${bomCount}').remove()">×</button></div>`)}async function saveBom(){const components=[...document.querySelectorAll('#bomItems .line-item')].map(row=>{const id=row.id.slice(2);return{componentPartId:v('bc'+id),qtyPer:Number(v('bq'+id)),uom:'PCS',scrapPercent:Number(v('bs'+id)||0)}});await submit('saveBOM',{parentPartId:v('bomParent'),bomVersion:v('bomVer'),effectiveDate:v('bomDate'),components},'BOM')}
async function submit(action,data,label){
  if(transactionBusy){toast('Transaksi sedang diproses. Double input diblokir.',false);return;}
  const fp=transactionFingerprint(action,data),now=Date.now();
  if(fp===lastSubmittedFingerprint && now-lastSubmittedAt<10000){toast('Transaksi yang sama baru saja dikirim. Double input diblokir.',false);return;}
  const active=document.querySelector('.nav-item.active')?.dataset.page||'dashboard';
  const btn=document.querySelector('#saveBtn,#saveDelivery,#saveOp,.process .primary:not([disabled])');
  transactionBusy=true;lastSubmittedFingerprint=fp;lastSubmittedAt=now;
  if(btn){btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='PROCESSING...';}
  try{
    const r=await apiPost(action,{...data,username:user().Username||'admin',requestId:makeRequestId()});
    if(!r.success)throw Error(r.message||label+' gagal');
    toast(label+' berhasil');
    if(['receive','transfer','issue','subAssembly','finishProduct','materialNG','testingPass','testingNG','delivery','stockOpname'].includes(action)){await refreshStockOnly();go(active)}else{await refreshAll();go(active)}
  }catch(e){toast(e.message||label+' gagal',false)}
  finally{transactionBusy=false;if(btn){btn.disabled=false;btn.textContent=btn.dataset.oldText||'Save';}}
}
function v(id){return document.getElementById(id)?.value?.trim()||''}
async function refreshStockOnly(){try{const r=await apiGet('stock');if(r.success)CACHE.stock=r.data||[]}catch(e){}}
async function refreshAll(){await loadCache();go(document.querySelector('.nav-item.active')?.dataset.page||'dashboard')}
document.getElementById('logoutBtn').onclick=logoutUser;document.getElementById('refreshBtn').onclick=refreshAll;document.getElementById('mobileMenu').onclick=()=>document.getElementById('nav').classList.toggle('open');
(async()=>{buildNav();await loadCache();go('dashboard')})();
</script></body></html>
